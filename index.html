/* ---------- Conexión con Apps Script ---------- */
function jsonp(action,extra,cb){
  if(!cfg.url)return cb({ok:false,error:'Falta la URL del conector'});
  const fn='jp_'+Date.now().toString(36)+Math.floor(Math.random()*1e4);let done=false;
  const s=document.createElement('script');
  const fin=d=>{if(done)return;done=true;clearTimeout(t);try{delete window[fn]}catch(e){}s.remove();cb(d)};
  const t=setTimeout(()=>fin({ok:false,error:'Sin respuesta del conector'}),20000);
  window[fn]=fin;s.onerror=()=>fin({ok:false,error:'No se pudo conectar con el conector'});
  const q=new URLSearchParams(Object.assign({action,prefix:fn,sheetUrl:cfg.sheetUrl,_:Date.now()},extra||{}));
  s.src=cfg.url+(cfg.url.includes('?')?'&':'?')+q;document.body.appendChild(s);
}
/* La Sheet es la fuente de verdad. Los cambios locales sin confirmar quedan en cola y no se pierden. */
function pull(cb){
  if(busy)return;busy=true;status(true,'sincronizando…');
  jsonp('get',{},d=>{busy=false;
    if(!d||!d.ok){status(false,(d&&d.error)||'Error de conexión');cb&&cb(false);return}
    const del=new Set((d.deletedIds||[]).map(String));
    const m=new Map((d.rows||[]).map(norm).filter(r=>r.id&&!del.has(r.id)).map(r=>[r.id,r]));
    Object.keys(queue).forEach(id=>{
      if(del.has(id)){delete queue[id];return}
      if(m.has(id)&&same(m.get(id),queue[id]))delete queue[id];else m.set(id,queue[id]);
    });
    const vacia=!m.size&&!del.size;
    rows=[...m.values()];sv(K.cache,rows);sv(K.queue,queue);statusOk();render();cb&&cb(true);
    if(due()>0){let d='';try{d=localStorage.getItem('jpack3_agday')}catch(e){}if(d!==today()){try{localStorage.setItem('jpack3_agday',today())}catch(e){}openAg()}}
    if(vacia&&!pull.asked){pull.asked=true;if(confirm('La Google Sheet está vacía. ¿Cargar la base inicial (9 fábricas + 160 distribuidores)?'))setTimeout(()=>loadBase(true),200)}
  });
}
function push(){
  const items=Object.values(queue);
  if(!cfg.url||!items.length)return;
  status(true,'guardando en Google Sheets…');
  fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'save',sheetUrl:cfg.sheetUrl,rows:items})})
    .then(()=>setTimeout(()=>pull(),1500)).catch(()=>statusOk());
}
function sync(){if(!cfg.url)return;Object.keys(queue).length?push():pull()}

  <div class="meta">${esc(p.tipo)} · ${esc(p.region)}${p.direccion?' · '+esc(p.direccion):''}</div>
  ${p.contacto&&p.contacto!=='Sin dato'?`<div class="meta">👤 ${esc(p.contacto)}</div>`:''}${p.detalle?`<div class="meta">${esc(p.detalle)}</div>`:''}
  ${queue[p.id]?'<div class="pend">⏳ Pendiente de enviar a Sheets</div>':''}</div><span class="pill ${p.estado}">${p.estado}</span></div>
  ${p.fecha?`<div class="meta">📅 Seguimiento: ${esc(p.fecha)}</div>`:''}${p.notas?`<div class="meta">📝 ${esc(p.notas.slice(0,100))}${p.notas.length>100?'…':''}</div>`:''}
  <div class="act">${tel?`<a class="btn" href="tel:${tel}">📞 Llamar</a>`:''}${wa?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">📲 WhatsApp</a>`:''}${p.correo?`<a class="btn" href="mailto:${esc(p.correo)}">✉️ Correo</a>`:''}<button class="btn" data-e="${esc(p.id)}">✏️ Gestionar</button></div></div>`;
}
function render(){
  const t=today(),c=s=>rows.filter(p=>p.estado===s).length;
  const hoy=rows.filter(p=>p.fecha&&p.fecha<=t&&p.estado!=='cliente'&&p.estado!=='descartado').length;
  $('kpis').innerHTML=[['Total',rows.length],['Para hoy',hoy],['Contactados',c('contactado')],['Interesados',c('interesado')],['Clientes',c('cliente')]].map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
  $('tabs').innerHTML=TABS.map(x=>`<button class="tab ${tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('');
  const sel=$('fr'),cur=sel.value,cnt={};rows.forEach(p=>{const r=regOf(p);cnt[r]=(cnt[r]||0)+1});
  const order=REG.map(x=>x[0]).concat(['Sin región']).filter(r=>cnt[r]);
  sel.innerHTML='<option value="">Todas las regiones ('+rows.length+')</option>'+order.map(r=>`<option value="${esc(r)}">${esc(r==='Sin región'?r:r==='Metropolitana'?'Región Metropolitana':'Región de '+r)} (${cnt[r]})</option>`).join('');
  sel.value=order.includes(cur)?cur:'';
  const nd_=due(),bn=$('bAgN');bn.textContent=nd_;bn.style.display=nd_?'block':'none';
  const gu=tab==='guia';$('fil').style.display=gu?'none':'flex';$('list').style.display=gu?'none':'block';$('guia').style.display=gu?'block':'none';if(gu)renderGuia();
  const it=gu?[]:visible();
  if(!gu)$('list').innerHTML=it.length?it.map(card).join(''):`<div class="empty">${!cfg.url?'Conecta tu Google Sheet con el botón ☁️ para cargar los prospectos.':tab==='hoy'?'Nada para hoy. Gestiona un prospecto y ponle fecha de seguimiento.':'Sin resultados.'}</div>`;
  if($('mAg').classList.contains('on'))renderAg();
}

/* ---------- Edición ---------- */
function openEd(id){
  editId=id;const p=id?rows.find(r=>r.id===id):norm({tipo:'Prospecto manual'});if(!p)return;
  $('eT').textContent=id?p.nombre:'＋ Añadir prospecto';$('eDel').style.display=id?'':'none';
  $('eF').innerHTML=FORM.map(([k,l,t])=>{
    let i;
    if(t==='area')i=`<textarea id="f_${k}" rows="3"></textarea>`;
    else if(t==='sel')i=`<select id="f_${k}">${['Prospecto manual','Fábrica','Distribuidor'].map(o=>`<option>${o}</option>`).join('')}</select>`;
    else if(t==='est')i=`<select id="f_${k}">${ST.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;
    else i=`<input id="f_${k}" type="${t}">`;
    return `<div class="f"><label>${l}</label>${i}</div>`}).join('');
  FORM.forEach(([k])=>{const e=$('f_'+k);if(k==='tipo'&&![...e.options].some(o=>o.value===p.tipo)){e.add(new Option(p.tipo,p.tipo))}e.value=p[k]||''});
  $('mEd').classList.add('on');
}
function saveEd(){
  const nombre=$('f_nombre').value.trim();if(!nombre){toast('Ingresa el nombre de la empresa');return}
  const old=editId?rows.find(r=>r.id===editId):null;
  const r=norm(Object.assign({},old||{},{id:editId||'M:'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),fuente:old?old.fuente:'Manual'}));
  FORM.forEach(([k])=>r[k]=$('f_'+k).value.trim());r.fecha=nd(r.fecha);
  queue[r.id]=r;sv(K.queue,queue);
  const i=rows.findIndex(x=>x.id===r.id);i>=0?rows[i]=r:rows.unshift(r);sv(K.cache,rows);
  $('mEd').classList.remove('on');render();statusOk();toast('Guardado');push();
}
function delEd(){
  const p=rows.find(r=>r.id===editId);if(!p)return;
  if(!confirm('¿Eliminar definitivamente "'+p.nombre+'"?\n\nSe borra de Google Sheets y no vuelve a aparecer en ningún dispositivo.'))return;
  jsonp('delete',{id:p.id},d=>{
    if(d&&d.ok){rows=rows.filter(r=>r.id!==p.id);delete queue[p.id];sv(K.cache,rows);sv(K.queue,queue);$('mEd').classList.remove('on');render();statusOk();toast('Eliminado')}
    else toast((d&&d.error)||'No se pudo eliminar. Revisa la conexión.');
  });
}

/* ---------- Eventos ---------- */
$('list').onclick=e=>{const b=e.target.closest('[data-e]');if(b)openEd(b.dataset.e)};
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}};
$('q').oninput=render;$('fe').onchange=render;$('fr').onchange=render;
$('fe').innerHTML+=ST.map(s=>`<option value="${s}">${s}</option>`).join('');
$('bAg').onclick=openAg;$('agD').onchange=renderAg;
$('agL').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const id=b.dataset.id,a=b.dataset.g;
  if(a==='gest'){$('mAg').classList.remove('on');openEd(id)}
  else if(a==='d1')upd(id,{fecha:addD(1)});else if(a==='d7')upd(id,{fecha:addD(7)});else if(a==='ok')upd(id,{fecha:''})};
$('bAdd').onclick=()=>openEd(null);$('eOk').onclick=saveEd;$('eDel').onclick=delEd;
$('bSync').onclick=()=>cfg.url?sync():$('bCfg').click();
$('bCfg').onclick=()=>{$('cSheet').value=cfg.sheetUrl;$('cUrl').value=cfg.url;$('mCfg').classList.add('on')};
$('cOk').onclick=()=>{
  const s=$('cSheet').value.trim(),u=$('cUrl').value.trim();
  if(!/^https:\/\/docs\.google\.com\/spreadsheets\/d\//.test(s)||!/^https:\/\/script\.google\.com\//.test(u)){toast('Revisa ambos enlaces');return}
  cfg={sheetUrl:s,url:u};sv(K.cfg,cfg);$('mCfg').classList.remove('on');pull();
};
$('cBase').onclick=()=>{if(!cfg.url){toast('Conecta primero la Sheet');return}$('mCfg').classList.remove('on');loadBase(false)};
$('cOff').onclick=()=>{cfg={sheetUrl:'',url:''};sv(K.cfg,cfg);$('mCfg').classList.remove('on');$('st').className='';$('st').textContent='Sin conectar';render()};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.closest('.mb').classList.remove('on'));
document.querySelectorAll('.mb').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('on')});
let th=null;try{th=localStorage.getItem(K.theme)}catch(e){}
if(th)document.documentElement.dataset.theme=th;
$('bTheme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem(K.theme,n)}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(()=>{if(!document.hidden&&!document.querySelector('.mb.on'))sync()},60000);
render();if(cfg.url){statusOk();sync()}
</script></body></html>
