<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jpack · App de Prospección</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<style>
:root{--bg:#F5F6F9;--surface:#FFFFFF;--surface-2:#FAFBFC;--text:#171B26;--text-dim:#5B6273;--border:#E1E4EA;--accent:#2F4CDD;--accent-dim:#EAEEFF;--green:#16A34A;--green-bg:#E7F6EC;--yellow:#B7791F;--yellow-bg:#FEF3D6;--red:#DC2626;--red-bg:#FCE8E8;--radius:8px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10131C;--surface:#171B27;--surface-2:#1E2332;--text:#E9EBF2;--text-dim:#9AA1B4;--border:#2A2F41;--accent:#7189FF;--accent-dim:#232A47;--green:#4ADE80;--green-bg:#123321;--yellow:#F2C94C;--yellow-bg:#3A2E0D;--red:#F87171;--red-bg:#3A1414}}
:root[data-theme="dark"]{--bg:#10131C;--surface:#171B27;--surface-2:#1E2332;--text:#E9EBF2;--text-dim:#9AA1B4;--border:#2A2F41;--accent:#7189FF;--accent-dim:#232A47;--green:#4ADE80;--green-bg:#123321;--yellow:#F2C94C;--yellow-bg:#3A2E0D;--red:#F87171;--red-bg:#3A1414}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top-row{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand h1{font-size:16px}
.brand span{color:var(--text-dim);font-size:12px;display:block}
.icon-btn{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--text-dim);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.kpi .lbl{color:var(--text-dim);font-size:11.5px}
.kpi .val{font-size:20px;font-weight:700;margin-top:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px}
.filters input{flex:1;min-width:160px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:14.5px}
.card .meta{color:var(--text-dim);font-size:12px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
.pill.nuevo{background:var(--surface-2);color:var(--text-dim)}
.pill.contactado{background:var(--yellow-bg);color:var(--yellow)}
.pill.interesado{background:var(--accent-dim);color:var(--accent)}
.pill.cliente{background:var(--green-bg);color:var(--green)}
.pill.descartado{background:var(--red-bg);color:var(--red)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions a,.actions button{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:7px;padding:6px 10px;font-size:12px;text-decoration:none;font-weight:600}
.actions .wa{background:#25D36622;border-color:#25D366;color:#1DAE54}
.note-prev{font-size:12px;color:var(--text-dim);margin-top:6px;font-style:italic}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:88vh;overflow:auto;border:1px solid var(--border)}
.modal h2{font-size:16px;margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13.5px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:7px;padding:8px 13px;font-size:13.5px;font-weight:550}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.seg h3{font-size:15px;margin-bottom:8px}
.seg .lbl2{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-top:10px}
.seg ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.pitch{background:var(--accent-dim);color:var(--accent);padding:8px 10px;border-radius:7px;font-size:13px;margin-top:6px}
.manual-tag{font-size:10px;color:var(--accent);font-weight:700;margin-top:4px}.sync-ok{font-size:10px;color:var(--green);font-weight:700;margin-top:4px}.sync-off{font-size:10px;color:var(--text-dim);font-weight:600;margin-top:4px}.btn-danger{border-color:var(--red)!important;color:var(--red)!important}.empty{padding:30px;text-align:center;color:var(--text-dim)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:9px 15px;border-radius:8px;font-size:13px;z-index:100;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text-dim);font-size:11px;text-transform:uppercase}
</style>
</head>
<body>
<div id="toast"></div>
<header class="top"><div class="top-row">
  <div class="brand"><div class="mark">J</div><div><h1>Jpack · Prospección</h1><span>Envases PP/PE — Chile</span></div></div>
  <button class="icon-btn" id="btnSheets" title="Conectar Google Sheets">☁️</button><button class="icon-btn" id="btnTheme" title="Modo oscuro/claro">🌙</button>
</div></header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab active" data-tab="hoy">📅 Hoy</button>
    <button class="tab" data-tab="fabricas">🍦 Fábricas de Helados (9)</button>
    <button class="tab" data-tab="distribuidores">📦 Distribuidores (160)</button>
    <button class="tab" data-tab="guia">📋 Guía de Venta</button>
  </div>
  <div class="filters" id="filters">
    <input id="search" placeholder="Buscar por nombre, comuna, contacto...">
    <select id="fRegion"><option value="">Todas las regiones</option></select>
    <select id="fEstado"><option value="">Todos los estados</option><option value="nuevo">Nuevo</option><option value="contactado">Contactado</option><option value="interesado">Interesado</option><option value="cliente">Cliente</option><option value="descartado">Descartado</option></select>
    <button class="btn primary" id="btnAddProspect">＋ Añadir prospecto</button>
  </div>
  <div id="sheetStatus" class="sync-off" style="margin:-6px 0 12px 2px">☁️ Google Sheets: no conectado</div>
  <div id="list"></div>
  <div id="guia" style="display:none"></div>
</div>

<div class="modal-bg" id="mSheets"><div class="modal">
  <h2>☁️ Conectar Google Sheets</h2>
  <div class="field"><label>1 · Enlace de la Google Sheet</label><input id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/..." autocomplete="off"></div>
  <div class="field"><label>2 · URL del conector Apps Script</label><input id="connectorUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></div>
  <div style="font-size:11.5px;color:var(--text-dim);background:var(--surface-2);padding:9px;border-radius:7px">La URL del conector se configura una sola vez. Después, este botón permite cargar y guardar prospectos en la misma planilla.</div>
  <div class="modal-actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="sheetTest">🔌 Probar conexión</button><button class="btn primary" id="sheetConnect">⚡ Conectar y sincronizar</button></div>
  <div class="modal-actions" style="margin-top:8px"><button class="btn" id="sheetOpen">📊 Abrir Google Sheet</button><button class="btn btn-danger" id="sheetDisconnect">Desconectar</button></div>
</div></div>

<div class="modal-bg" id="mProspect"><div class="modal">
  <h2>＋ Añadir prospecto manual</h2>
  <div class="field"><label>Empresa / Prospecto *</label><input id="pNombre" placeholder="Nombre de la empresa"></div>
  <div class="field"><label>Tipo</label>
    <select id="pTipo"><option value="Prospecto manual">Prospecto manual</option><option value="Fábrica">Fábrica</option><option value="Distribuidor">Distribuidor</option></select>
  </div>
  <div class="field"><label>Región / Comuna</label><input id="pRegion" placeholder="Ej.: Región Metropolitana · Buin"></div>
  <div class="field"><label>Dirección</label><input id="pDireccion" placeholder="Dirección o ubicación"></div>
  <div class="field"><label>Contacto</label><input id="pContacto" placeholder="Nombre y cargo"></div>
  <div class="field"><label>Teléfono</label><input id="pTelefono" type="tel" placeholder="+56 9 ..."></div>
  <div class="field"><label>Correo</label><input id="pCorreo" type="email" placeholder="correo@empresa.cl"></div>
  <div class="field"><label>Detalle / oportunidad</label><textarea id="pDetalle" rows="3" placeholder="Qué vende, qué necesita, oportunidad detectada..."></textarea></div>
  <div class="modal-actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="prospectSave">Agregar prospecto</button></div>
</div></div>

<div class="modal-bg" id="mCrm"><div class="modal">
  <h2 id="crmTitle">Prospecto</h2>
  <div class="field"><label>Estado</label>
    <select id="crmEstado"><option value="nuevo">Nuevo</option><option value="contactado">Contactado</option><option value="interesado">Interesado</option><option value="cliente">Cliente</option><option value="descartado">Descartado</option></select>
  </div>
  <div class="field"><label>Próximo seguimiento</label><input type="date" id="crmFecha"></div>
  <div class="field"><label>Notas</label><textarea id="crmNotas" rows="4" placeholder="Qué conversaron, qué le interesa, próximos pasos..."></textarea></div>
  <div class="modal-actions"><button class="btn ghost" data-close>Cerrar</button><button class="btn primary" id="crmSave">Guardar</button></div>
</div></div>

const LS='jpack_crm_v1';
const DELETED_LS='jpack_deleted_prospects_v1';
const MANUAL_LS='jpack_manual_prospects_v1';
const SHEETS_LS='jpack_google_sheets_v1';
let sheetsCfg=loadSheetsCfg();
function loadSheetsCfg(){ try{return JSON.parse(localStorage.getItem(SHEETS_LS))||{sheetUrl:'',connectorUrl:'',connected:false,lastSync:''};}catch(e){return {sheetUrl:'',connectorUrl:'',connected:false,lastSync:''};} }
function saveSheetsCfg(){ try{localStorage.setItem(SHEETS_LS,JSON.stringify(sheetsCfg));}catch(e){} }
function setSheetStatus(ok,msg){ const el=$('sheetStatus'); if(!el)return; el.className=ok?'sync-ok':'sync-off'; el.textContent=(ok?'☁️ ':'☁️ ')+msg; }
function sheetRows(){ return ALL.filter(p=>!deletedProspectIds.has(p.id)).map(p=>{const c=getCrm(p.id); return {...p,fuente:p.manual?'Manual':'Base Jpack',estado:c.estado,fecha:c.fecha||'',notas:c.notas||''};}); }
function sheetJsonp(action, cb){
  const base=(sheetsCfg.connectorUrl||'').trim(); if(!base) return cb({ok:false,error:'Falta la URL del conector Apps Script'});
  const fn='jpackCb_'+Date.now().toString(36); window[fn]=function(data){try{delete window[fn];}catch(e){};script.remove();cb(data);};
  const script=document.createElement('script'); script.src=base+'?action='+encodeURIComponent(action)+'&prefix='+fn+'&sheetUrl='+encodeURIComponent(sheetsCfg.sheetUrl||'')+'&_='+Date.now(); script.onerror=()=>{try{delete window[fn];}catch(e){};script.remove();cb({ok:false,error:'No se pudo conectar con el conector'});}; document.body.appendChild(script);
}
function postToSheet(rows, cb){
  const base=(sheetsCfg.connectorUrl||'').trim();
  if(!base){ if(cb)cb({ok:false,error:'Falta la URL del conector Apps Script'}); return; }

  const payload=JSON.stringify({action:'save',sheetUrl:sheetsCfg.sheetUrl||'',rows:Array.isArray(rows)?rows:[]});
  let finished=false;
  const done=(result)=>{
    if(finished)return;
    finished=true;
    if(result && result.ok){
      try{ localStorage.removeItem('jpack_pending_sheet_write_v1'); }catch(e){}
    }
    if(cb)cb(result);
  };

  // Guarda una copia pendiente para que un corte de red en el celular
  // pueda reintentarse automáticamente en la próxima apertura/sincronización.
  try{
    localStorage.setItem('jpack_pending_sheet_write_v1', payload);
  }catch(e){}

  // Método principal: POST directo. text/plain evita el preflight CORS y
  // funciona mejor en navegadores móviles con Google Apps Script.
  try{
    fetch(base,{
      method:'POST',
      mode:'no-cors',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:payload
    }).then(()=>{
      // En no-cors no podemos leer la respuesta de Apps Script; que el
      // navegador haya completado la petición es la señal disponible.
      setTimeout(()=>done({ok:true,method:'fetch'}),1200);
    }).catch(()=>{ fallbackPostToSheet_(base,payload,done); });
    return;
  }catch(e){}

  fallbackPostToSheet_(base,payload,done);
}

function fallbackPostToSheet_(base,payload,done){
  try{
    const iframe=document.createElement('iframe');
    iframe.name='jpackPost_'+Date.now();
    iframe.style.display='none';
    document.body.appendChild(iframe);
    const form=document.createElement('form');
    form.method='POST'; form.action=base; form.target=iframe.name; form.style.display='none';
    const input=document.createElement('input');
    input.type='hidden'; input.name='payload'; input.value=payload;
    form.appendChild(input); document.body.appendChild(form); form.submit();
    setTimeout(()=>{
      try{form.remove();iframe.remove();}catch(e){}
      done({ok:true,method:'form-fallback'});
    },1800);
  }catch(e){
    done({ok:false,error:'No se pudo enviar la información a Google Sheets'});
  }
}

function retryPendingSheetWrite(){
  if(!sheetsCfg.connectorUrl)return;
  let pending='';
  try{pending=localStorage.getItem('jpack_pending_sheet_write_v1')||'';}catch(e){}
  if(!pending)return;
  try{
    const obj=JSON.parse(pending);
    if(!obj || obj.action!=='save' || !Array.isArray(obj.rows))return;
    postToSheet(obj.rows,(res)=>{
      if(res && res.ok){
        sheetsCfg.connected=true;
        sheetsCfg.lastSync=new Date().toISOString();
        saveSheetsCfg();
        setSheetStatus(true,'conectado · sincronización recuperada');
      }
    });
  }catch(e){}
}
function applySheetRows(rows){
  if(!Array.isArray(rows))return;
  rows = rows.filter(r=>r && r.id && !deletedProspectIds.has(r.id)); const base=allProspects(); const byId=new Map(base.map(p=>[p.id,p])); const manuals=[];
  rows.forEach(r=>{
    const baseP=byId.get(r.id);
    if(baseP){ if(r.estado||r.fecha||r.notas) crm[r.id]={estado:r.estado||'nuevo',fecha:r.fecha||'',notas:r.notas||''}; }
    else if(r.id){ manuals.push({manual:true,id:r.id,tipo:r.tipo||'Prospecto manual',nombre:r.nombre||'',region:r.region||'',direccion:r.direccion||'',telefono:r.telefono||'',correo:r.correo||'',contacto:r.contacto||'',detalle:r.detalle||''}); crm[r.id]={estado:r.estado||'nuevo',fecha:r.fecha||'',notas:r.notas||''}; }
  });
  manualProspects=manuals; saveManual(manualProspects); saveCrm(crm); refreshAll();
}
function syncSheets(){
  if(!sheetsCfg.connectorUrl){setSheetStatus(false,'no conectado');return;}
  setSheetStatus(false,'sincronizando…');
  sheetJsonp('get',data=>{
    if(!data||!data.ok){setSheetStatus(false,'error de conexión');notify(data?.error||'No se pudo leer Google Sheets');return;}
    const rows=data.rows||[];
    if(rows.length){
      applySheetRows(rows);
      postToSheet(sheetRows(),(res)=>{
        if(res && res.ok){
          sheetsCfg.connected=true; sheetsCfg.lastSync=new Date().toISOString(); saveSheetsCfg();
          setSheetStatus(true,'conectado · '+rows.length+' registros'); render(); notify('Sheets sincronizado');
        }else{
          setSheetStatus(false,'pendiente de sincronización');
          notify('Datos guardados en el celular; se reintentará Sheets');
        }
      });
    }else {
      postToSheet(sheetRows(),(res)=>{
        if(res && res.ok){
          sheetsCfg.connected=true; sheetsCfg.lastSync=new Date().toISOString(); saveSheetsCfg();
          setSheetStatus(true,'conectado · base inicial enviada'); render(); notify('Base enviada a Google Sheets');
        }else{
          setSheetStatus(false,'pendiente de sincronización');
          notify('Datos guardados en el celular; se reintentará Sheets');
        }
      });
    }
  });
}
function syncWrite(){
  if(!sheetsCfg.connectorUrl)return;
  setSheetStatus(false,'guardando en Google Sheets…');
  postToSheet(sheetRows(),(res)=>{
    if(res && res.ok){
      sheetsCfg.connected=true;
      sheetsCfg.lastSync=new Date().toISOString();
      saveSheetsCfg();
      setSheetStatus(true,'conectado · actualizado');
    }else{
      sheetsCfg.connected=false;
      saveSheetsCfg();
      setSheetStatus(false,'pendiente de sincronización');
    }
  });
}

function loadCrm(){ try{ return JSON.parse(localStorage.getItem(LS))||{}; }catch(e){ return {}; } }
function saveCrm(c){ try{ localStorage.setItem(LS, JSON.stringify(c)); }catch(e){} }
function loadManual(){ try{ return JSON.parse(localStorage.getItem(MANUAL_LS))||[]; }catch(e){ return []; } }
function saveManual(a){ try{ localStorage.setItem(MANUAL_LS, JSON.stringify(a)); }catch(e){} }
function loadDeletedProspects(){ try{ return new Set(JSON.parse(localStorage.getItem(DELETED_LS))||[]); }catch(e){ return new Set(); } }
function saveDeletedProspects(){ try{ localStorage.setItem(DELETED_LS, JSON.stringify([...deletedProspectIds])); }catch(e){} }
let deletedProspectIds = loadDeletedProspects();
let crm = loadCrm();
let manualProspects = loadManual();
let theme = null; try{ theme=localStorage.getItem('jpack_theme'); }catch(e){}
if(theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('btnTheme').textContent = document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
document.getElementById('btnTheme').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme'); const next=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',next); try{localStorage.setItem('jpack_theme',next);}catch(e){} document.getElementById('btnTheme').textContent=next==='dark'?'☀️':'🌙'; };
function notify(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(notify._t); notify._t=setTimeout(()=>t.style.display='none',3000); }
const $=id=>document.getElementById(id);
function openSheets(){ $('sheetUrl').value=sheetsCfg.sheetUrl||''; $('connectorUrl').value=sheetsCfg.connectorUrl||''; $('mSheets').classList.add('open'); }
$('btnSheets').onclick=openSheets;
$('sheetTest').onclick=()=>{ sheetsCfg.sheetUrl=$('sheetUrl').value.trim(); sheetsCfg.connectorUrl=$('connectorUrl').value.trim(); if(!sheetsCfg.connectorUrl){notify('Pega primero la URL del conector Apps Script');return;} saveSheetsCfg(); sheetJsonp('ping',d=>{if(d&&d.ok){setSheetStatus(true,'conector disponible');notify('Conector funcionando');}else{setSheetStatus(false,'conector no disponible');notify(d?.error||'No se pudo probar');}}); };
$('sheetConnect').onclick=()=>{ sheetsCfg.sheetUrl=$('sheetUrl').value.trim(); sheetsCfg.connectorUrl=$('connectorUrl').value.trim(); if(!sheetsCfg.sheetUrl||!sheetsCfg.connectorUrl){notify('Completa ambos enlaces');return;} saveSheetsCfg(); $('mSheets').classList.remove('open'); syncSheets(); };
$('sheetOpen').onclick=()=>{const u=$('sheetUrl').value.trim()||sheetsCfg.sheetUrl;if(u)window.open(u,'_blank','noopener');else notify('Agrega primero el enlace de la Google Sheet');};
$('sheetDisconnect').onclick=()=>{sheetsCfg={sheetUrl:'',connectorUrl:'',connected:false,lastSync:''};saveSheetsCfg();setSheetStatus(false,'no conectado');$('mSheets').classList.remove('open');notify('Google Sheets desconectado');};

function allProspects(){
  const list = [];
  FABRICAS.forEach(f=>list.push({tipo:'Fábrica', id:'F:'+f.empresa, nombre:f.empresa, region:f.comuna, direccion:f.direccion, telefono:f.telefono, correo:f.correo, contacto:f.contacto, detalle:f.detalle}));
  DISTRIBUIDORES.forEach(r=>r.distribuidores.forEach(d=>list.push({tipo:'Distribuidor', id:'D:'+d.empresa+r.codigo, nombre:d.empresa, region:r.region+' ('+r.codigo+')', direccion:d.direccion, telefono:d.telefono, correo:d.correo, contacto:d.contacto, detalle:''})));
  return list;
}
let ALL = allProspects();

function refreshAll(){
  ALL = allProspects().concat(manualProspects).filter(p=>!deletedProspectIds.has(p.id));
  populateRegionFilter();
}

// Recupera automáticamente cualquier escritura que haya quedado pendiente
// por falta de conexión en el celular.
setTimeout(retryPendingSheetWrite, 900);

function getCrm(id){ return crm[id] || {estado:'nuevo', fecha:'', notas:''}; }
function waLink(tel, nombre){ const digits=(tel||'').replace(/[^0-9]/g,''); if(!digits) return ''; const text=encodeURIComponent('Hola, le escribo de Jpack (envases PP/PE). Quería conversar sobre sus necesidades de envases para su operación.'); return 'https://wa.me/'+digits+'?text='+text; }

function populateRegionFilter(){
  const regions = [...new Set(ALL.map(p=>p.region))].sort();
  $('fRegion').innerHTML = '<option value="">Todas las regiones/comunas</option>' + regions.map(r=>`<option value="${r}">${r}</option>`).join('');
}
refreshAll();
if(sheetsCfg.connectorUrl) setSheetStatus(sheetsCfg.connected,'Sheets: '+(sheetsCfg.connected?'conectado':'configurado'));

let currentTab = 'hoy';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  currentTab = t.dataset.tab;
  $('filters').style.display = currentTab==='guia' ? 'none' : 'flex';
  $('list').style.display = currentTab==='guia' ? 'none' : 'block';
  $('guia').style.display = currentTab==='guia' ? 'block' : 'none';
  render();
});

function renderKpis(){
  let nuevo=0,contactado=0,interesado=0,cliente=0;
  ALL.forEach(p=>{ const c=getCrm(p.id); if(c.estado==='nuevo')nuevo++; else if(c.estado==='contactado')contactado++; else if(c.estado==='interesado')interesado++; else if(c.estado==='cliente')cliente++; });
  const today = new Date().toISOString().slice(0,10);
  const hoy = ALL.filter(p=>{ const c=getCrm(p.id); return c.fecha && c.fecha<=today && c.estado!=='cliente' && c.estado!=='descartado'; }).length;
  $('kpis').innerHTML = `
    <div class="kpi"><div class="lbl">Total prospectos</div><div class="val">${ALL.length}</div></div>
    <div class="kpi"><div class="lbl">📅 Para hoy</div><div class="val">${hoy}</div></div>
    <div class="kpi"><div class="lbl">Contactados</div><div class="val">${contactado}</div></div>
    <div class="kpi"><div class="lbl">Interesados</div><div class="val">${interesado}</div></div>
    <div class="kpi"><div class="lbl">Clientes</div><div class="val">${cliente}</div></div>`;
}

function cardHTML(p){
  const c = getCrm(p.id);
  const estadoLabel = {nuevo:'Nuevo',contactado:'Contactado',interesado:'Interesado',cliente:'Cliente',descartado:'Descartado'}[c.estado];
  const wa = waLink(p.telefono, p.nombre);
  return `<div class="card">
    <div class="row1"><div><h3>${p.nombre}</h3><div class="meta">${p.tipo} · ${p.region}${p.direccion?' · '+p.direccion:''}</div>
    ${p.contacto&&p.contacto!=='Sin dato'?`<div class="meta">👤 ${p.contacto}</div>`:''}
    ${p.detalle?`<div class="meta">${p.detalle}</div>`:'' }${p.manual?`<div class="manual-tag">● Prospecto agregado manualmente</div>`:''}</div>
    <span class="pill ${c.estado}">${estadoLabel}</span></div>
    ${c.notas?`<div class="note-prev">📝 ${c.notas.slice(0,90)}${c.notas.length>90?'…':''}</div>`:''}
    ${c.fecha?`<div class="note-prev">📅 Seguimiento: ${c.fecha}</div>`:''}
    <div class="actions">
      ${p.telefono?`<a href="tel:${p.telefono.replace(/[^0-9+]/g,'')}">📞 Llamar</a>`:''}
      ${wa?`<a class="wa" href="${wa}" target="_blank" rel="noopener">📲 WhatsApp</a>`:''}
      ${p.correo?`<a href="mailto:${p.correo}">✉️ Correo</a>`:''}
      <button data-edit="${p.id}">✏️ Gestionar</button>
      <button data-delete-prospect="${p.id}">🗑️ Eliminar</button>
    </div>
  </div>`;
}

function render(){
  renderKpis();
  if(currentTab==='guia'){ renderGuia(); return; }
  const q = $('search').value.trim().toLowerCase();
  const fr = $('fRegion').value;
  const fe = $('fEstado').value;
  const today = new Date().toISOString().slice(0,10);
  let items = ALL;
  if(currentTab==='fabricas') items = items.filter(p=>p.tipo==='Fábrica');
  else if(currentTab==='distribuidores') items = items.filter(p=>p.tipo==='Distribuidor');
  else if(currentTab==='hoy') items = items.filter(p=>{ const c=getCrm(p.id); return c.fecha && c.fecha<=today && c.estado!=='cliente' && c.estado!=='descartado'; });
  if(q) items = items.filter(p=>(p.nombre+' '+p.region+' '+p.contacto+' '+p.direccion).toLowerCase().includes(q));
  if(fr) items = items.filter(p=>p.region===fr);
  if(fe) items = items.filter(p=>getCrm(p.id).estado===fe);
  $('list').innerHTML = items.length ? items.map(cardHTML).join('') : `<div class="empty">${currentTab==='hoy'?'Nada para hoy. Gestiona un prospecto y ponle fecha de seguimiento para que aparezca aquí.':'Sin resultados para este filtro.'}</div>`;
  $('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCrm(b.dataset.edit));
  $('list').querySelectorAll('[data-delete-prospect]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.deleteProspect;
    const p=ALL.find(x=>x.id===id);
    if(!p) return;
    const tipo=p.tipo||'Prospecto';
    if(confirm('¿Eliminar definitivamente "'+(p.nombre||'')+'" ('+tipo+')?\n\nSe eliminará de JPACK y de Google Sheets. Esta acción no cambia el estado a "Descartado".')){
      deletedProspectIds.add(id);
      saveDeletedProspects();
      manualProspects=manualProspects.filter(x=>x.id!==id);
      delete crm[id];
      saveManual(manualProspects);
      saveCrm(crm);
      refreshAll();
      render();
      notify('Prospecto eliminado de JPACK');
      syncWrite();
    }
  });
}

function renderGuia(){
  let html = '<div class="seg"><h3>📦 Matriz: ¿Quién compra qué?</h3><div style="overflow-x:auto"><table><thead><tr><th>Familia</th><th>Formatos</th><th>Comprador</th><th>Necesidad</th><th>Argumento</th></tr></thead><tbody>';
  MATRIZ.forEach(m=>{ html += `<tr><td><b>${m.familia}</b></td><td>${m.formatos}</td><td>${m.comprador}</td><td>${m.necesidad}</td><td>${m.argumento}</td></tr>`; });
  html += '</tbody></table></div></div>';
  SEGMENTOS.forEach(s=>{
    html += `<div class="seg"><h3>🎯 ${s.segmento}</h3>
      <div class="lbl2">Productos calificados</div><ul>${s.productos.map(p=>`<li>${p}</li>`).join('')}</ul>
      <div class="lbl2">Perfil del decisor</div><ul>${s.decisor.map(d=>`<li>${d}</li>`).join('')}</ul>
      <div class="lbl2">Dolor</div><div style="font-size:13px">${s.dolor}</div>
      <div class="pitch">💬 ${s.pitch}</div></div>`;
  });
  $('guia').innerHTML = html;
}

function openCrm(id){
  const p = ALL.find(x=>x.id===id); const c = getCrm(id);
  $('crmTitle').textContent = p.nombre;
  $('crmEstado').value = c.estado; $('crmFecha').value = c.fecha||''; $('crmNotas').value = c.notas||'';
  $('mCrm').dataset.id = id;
  $('mCrm').classList.add('open');
}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal-bg').classList.remove('open'));
document.querySelectorAll('.modal-bg').forEach(m=>m.onclick=e=>{ if(e.target===m) m.classList.remove('open'); });
$('crmSave').onclick=()=>{
  const id = $('mCrm').dataset.id;
  crm[id] = { estado:$('crmEstado').value, fecha:$('crmFecha').value, notas:$('crmNotas').value };
  saveCrm(crm); $('mCrm').classList.remove('open'); notify('Guardado'); render(); syncWrite();
};
$('btnAddProspect').onclick=()=>{
  ['pNombre','pRegion','pDireccion','pContacto','pTelefono','pCorreo','pDetalle'].forEach(id=>$(id).value='');
  $('pTipo').value='Prospecto manual';
  $('mProspect').classList.add('open');
  setTimeout(()=>$('pNombre').focus(),50);
};

$('prospectSave').onclick=()=>{
  const nombre=$('pNombre').value.trim();
  if(!nombre){ notify('Ingresa el nombre de la empresa o prospecto'); $('pNombre').focus(); return; }
  const id='M:'+Date.now().toString(36);
  const p={
    manual:true, id, tipo:$('pTipo').value, nombre,
    region:$('pRegion').value.trim(), direccion:$('pDireccion').value.trim(),
    telefono:$('pTelefono').value.trim(), correo:$('pCorreo').value.trim(),
    contacto:$('pContacto').value.trim(), detalle:$('pDetalle').value.trim()
  };
  manualProspects.unshift(p);
  saveManual(manualProspects);
  crm[id]={estado:'nuevo',fecha:'',notas:''};
  saveCrm(crm);
  $('mProspect').classList.remove('open');
  refreshAll(); render();
  notify('Prospecto agregado');
  syncWrite();
};

$('search').addEventListener('input', render);
$('fRegion').addEventListener('change', render);
$('fEstado').addEventListener('change', render);

render();
</script>
</body>
</html>
